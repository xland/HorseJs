<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnNotifyShow" class="btn">显示一个通知</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnNotifyShow").addEventListener("click", async () => {
          let data = await horse.notify.show("HorseJs", "通知标题", "通知内容\n换行\n换行");
          console.log(data);
        });
      });
    </script>
  </body>
</html>
