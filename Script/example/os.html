<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/example.css" />
</head>

<body>
  <div class="box">
    <div id="btnGetVersion" class="btn">获取系统版本号</div>
    <div id="btnGetCpuId" class="btn">获取Cpu Id</div>
    <div id="btnGetDiskId" class="btn">获取磁盘串号</div>
    <div id="btnGetUserLang" class="btn">获取用户语言</div>
    <div id="btnGetOsLang" class="btn">获取系统语言</div>
    <div id="btnGetOsColor" class="btn">获取系统默认颜色</div>
    <div id="btnPreventSleep" class="btn">阻止睡眠、休眠</div>
    <div id="btnStopPreventSleep" class="btn">取消阻止睡眠、休眠</div>
    <div id="btnOnOsLock" class="btn">监听锁屏事件</div>
    <div id="btnOffOsLock" class="btn">取消监听锁屏事件</div>
    <div id="btnGetIpAddr" class="btn">获取IP地址</div>
    <div id="btnRegNetConnListener" class="btn">监听网络连接、断开事件</div>
    <div id="btnShowNotify" class="btn">显示系统通知</div>
    <div id="btnCreateTray" class="btn">创建托盘图标</div>
    <div id="btnDestroyTray" class="btn">销毁托盘图标</div>
    <div id="btnStartProcess" class="btn">启动一个进程</div>
    <div id="btnCredWrite" class="btn">向用户凭据区写入文本</div>
    <div id="btnCredRead" class="btn">从用户凭据区读取文本</div>
    <div id="btnCredDel" class="btn">删除用户凭据</div>
  </div>
  <script>
    let $ = (selector) => document.querySelector(selector);
    window.addEventListener("DOMContentLoaded", async () => {
      $("#btnGetVersion").addEventListener("click", async () => {
        let data = await horse.os.getOsVer();
        console.log(data);
      });
      $("#btnGetCpuId").addEventListener("click", async () => {
        let data = await horse.os.getCpuId();
        console.log(JSON.stringify(data));
      });
      $("#btnGetDiskId").addEventListener("click", async () => {
        let data = await horse.os.getDiskId();
        console.log(JSON.stringify(data));
      });
      $("#btnGetUserLang").addEventListener("click", async () => {
        let data = await horse.os.getUserLang();
        console.log(JSON.stringify(data));
      });
      $("#btnGetOsLang").addEventListener("click", async () => {
        let data = await horse.os.getOsLang();
        console.log(JSON.stringify(data));
      });
      $("#btnGetOsColor").addEventListener("click", async () => {
        let data = await horse.os.getOsColor();
        console.log(JSON.stringify(data));
      });
      $("#btnPreventSleep").addEventListener("click", async () => {
        let data = await horse.os.preventSleep();
        console.log(JSON.stringify(data));
      });
      $("#btnStopPreventSleep").addEventListener("click", async () => {
        let data = await horse.os.stopPreventSleep();
        console.log(JSON.stringify(data));
      });
      $("#btnOnOsLock").addEventListener("click", async () => {
        await horse.os.on("osLock", (data) => {
          console.log(JSON.stringify(data));
        });
      });
      $("#btnOffOsLock").addEventListener("click", async () => {
        await horse.os.off("osLock");
      });
      $("#btnGetIpAddr").addEventListener("click", async () => {
        let data = await horse.os.getIpAddr();
        console.log(data);
      });
      $("#btnRegNetConnListener").addEventListener("click", async () => {
        let data = await horse.os.on("netConnChanged", (data) => {
          console.log(data);
        });
        console.log(data);
      });
      $("#btnShowNotify").addEventListener("click", async () => {
        let data = await horse.os.showNotify("HorseJs", "通知标题", "通知内容\n换行\n换行");
        console.log(data);
      });
      $("#btnCreateTray").addEventListener("click", async () => {
        let data = await horse.os.createTray({
          tip: "托盘图标的Tip",
          rightBtnDown: () => {
            console.log("rightBtnDown");
          },
          leftBtnDown: () => {
            console.log("leftBtnDown");
          },
          menu: [
            {
              text: "退出",
              click: () => {
                console.log("tray menu item click");
              },
            },
          ],
        });
        console.log(data);
        window.__trayId = data.id;
      });
      $("#btnDestroyTray").addEventListener("click", async () => {
        let data = await horse.os.destroyTray(window.__trayId);
        console.log(data);
      });
      $("#btnStartProcess").addEventListener("click", async () => {
        let data = await horse.os.spawn("notepad.exe");
        console.log(data);
      });
      $("#btnCredWrite").addEventListener("click", async () => {
        let data = await horse.os.creadWrite("keyName", "allen 测试中文");
        console.log(data);
      });
      $("#btnCredRead").addEventListener("click", async () => {
        let data = await horse.os.credRead("keyName");
        console.log(data);
      });
      $("#btnCredDel").addEventListener("click", async () => {
        let data = await horse.os.credDel("keyName");
        console.log(data);
      });
    });
  </script>
</body>

</html>
