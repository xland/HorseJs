          console.log(data);
        });
        $("#btnCreateShortcut").addEventListener("click", async () => {
          let data = await horse.os.createShortcut("C:\\Windows\\System32\\cmd.exe", "C:\\Users\\liuxiaolun\\Desktop\\cmd.lnk", "命令行", "C:\\Windows\\System32\\");
