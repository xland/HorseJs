<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../css/example.css" />
</head>

<body>
  <div class="box">
    <div id="btnGetAddress" class="btn">获取IP地址</div>
    <div id="btnRegNetConnListener" class="btn">监听网络连接、断开事件</div>
    <div id="btnHttpService" class="btn">启动Http服务（未完成）</div>
    <div id="btnWSService" class="btn">启动WebSocket服务（未完成）</div>
    <div id="btnHttpReq" class="btn">监听Http请求（未完成）</div>
    <div id="btnStopHttpReq" class="btn">取消监听Http请求（未完成）</div>
    <div id="btnWSEvent" class="btn">监听WebSocket消息（未完成）</div>
    <div id="btnStopWSEvent" class="btn">取消监听WebSocket消息（未完成）</div>
    <p>暂时不打算做命名管道，因为命名管道还得处理粘包问题，很难说这是业务的职责还是框架的职责，有需求的朋友提Issue吧</p>
  </div>
  <script>
    let $ = (selector) => document.querySelector(selector);
    window.addEventListener("DOMContentLoaded", async () => {
      $("#btnGetAddress").addEventListener("click", async () => {
        let data = await horse.net.getAddress();
        console.log(data);
      });
      $("#btnRegNetConnListener").addEventListener("click", async () => {
        let data = await horse.net.on("connChanged", (data) => {
          console.log(data);
        });
        console.log(data);
      });
    });
  </script>
</body>

</html>
