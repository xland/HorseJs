<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnOpenPathDialog" class="btn">打开一个文件路径</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnOpenPathDialog").addEventListener("click", async () => {
          let data = await horse.dialog.openPathDialog({
            title: "我的窗口标题",
            okBtnText: "选择文件",
            defaultDir: "C:\\Users",
            type: "file", //或"dir"，默认值为file
            filter: [
              ["All Files", "*.*"],
              ["Image Files", "*.jpg;*.png"],
            ], //只有type是file的时候才有效
            multiSelection: true, //默认值false
            showHiddenFile: true, //默认值false
          });
          console.log(data);
        });
      });
    </script>
  </body>
</html>
