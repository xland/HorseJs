<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnGetAllScreenInfo" class="btn">获取所有屏幕信息</div>
      <div id="btnGetDesktop" class="btn">获取桌面矩形</div>
      <div id="btnGetColor" class="btn">获取所有屏幕上某一点的颜色</div>
      <div id="btnGetImg" class="btn">获取屏幕某个区域的图像（未完成）</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnGetAllScreenInfo").addEventListener("click", async () => {
          let data = await horse.screen.getAll();
          console.log(data);
        });
        $("#btnGetDesktop").addEventListener("click", async () => {
          let data = await horse.screen.getDesktop();
          console.log(data);
        });
        $("#btnGetColor").addEventListener("click", async () => {
          let data = await horse.screen.getColor(100, 100);
          console.log(data);
        });
      });
    </script>
  </body>
</html>
