<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnGetAllScreenInfo" class="btn">获取所有屏幕信息</div>
      <div id="btnGetDesktop" class="btn">获取桌面矩形（支持多个屏幕）</div>
      <div id="btnGetColor" class="btn">获取所有屏幕上某一点的颜色</div>
      <div id="btnGetImg" class="btn">获取屏幕某个区域的图像</div>
      <div id="imgBox">
        <img id="imgIns" src="" alt="" style="display: none" />
      </div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnGetAllScreenInfo").addEventListener("click", async () => {
          let data = await horse.screen.getAll();
          console.log(data);
        });
        $("#btnGetDesktop").addEventListener("click", async () => {
          let data = await horse.screen.getDesktop();
          console.log(data);
        });
        $("#btnGetColor").addEventListener("click", async () => {
          let data = await horse.screen.getColor(100, 100);
          console.log(data);
        });
        $("#btnGetImg").addEventListener("click", async () => {
          let data = await horse.screen.getImg(100, 100, 800, 600);
          const uint8Array = new Uint8Array(data.buffer); // 字节视图
          const blob = new Blob([uint8Array], { type: "image/png" });
          const url = URL.createObjectURL(blob);
          data.release();
          $("#imgIns").setAttribute("src", url);
          $("#imgIns").setAttribute("style", `width: ${data.w}px; height: ${data.h}px;`);
        });
        $("#imgIns").addEventListener("click", async () => {
          $("#imgIns").setAttribute("style", `display: none;`);
        });
      });
    </script>
  </body>
</html>
