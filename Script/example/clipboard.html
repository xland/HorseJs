<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnGetDataType" class="btn">获取剪切板内的数据类型</div>
      <div id="btnReadClipBoardText" class="btn">读取剪切板内的文本</div>
      <div id="btnWriteClipBoardText" class="btn">向剪切板内写入文本</div>
      <div id="btnReadClipBoardHtml" class="btn">读取剪切板内的html</div>
      <div id="btnWriteClipBoardHtml" class="btn">向剪切板写入html</div>
      <div id="btnReadClipBoardRtf" class="btn">读取剪切板内的Rtf</div>
      <div id="btnWriteClipBoardRtf" class="btn">向剪切板写入Rtf</div>
      <div id="btnReadImg" class="btn">读取剪切板内的Image</div>
      <div id="btnWriteImg" class="btn">向剪切板写入Image</div>
      <div id="btnGetFile" class="btn">读取剪切板内的文件</div>
      <div id="btnAddFile" class="btn">向剪切板写入文件</div>
      <div id="btnClearClipboard" class="btn">清空剪切板</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnGetDataType").addEventListener("click", async () => {
          let data = await horse.clipboard.getDataType();
          console.log(data);
        });
        $("#btnReadClipBoardText").addEventListener("click", async () => {
          let data = await horse.clipboard.readText();
          console.log(data);
        });
        $("#btnWriteClipBoardText").addEventListener("click", async () => {
          let data = await horse.clipboard.writeText("待写入的文本");
          console.log(data);
        });
        $("#btnReadClipBoardHtml").addEventListener("click", async () => {
          let data = await horse.clipboard.readHtml();
          console.log(data);
        });
        $("#btnWriteClipBoardHtml").addEventListener("click", async () => {
          let data = await horse.clipboard.writeHtml(`<h1>Hello, World!</h1><p>中文</p>`);
          console.log(data);
        });
        $("#btnReadClipBoardRtf").addEventListener("click", async () => {
          let data = await horse.clipboard.readRtf();
          console.log(data);
        });
        $("#btnWriteClipBoardRtf").addEventListener("click", async () => {
          const rtfContent =
            "{\\rtf1\\ansi\\ansicpg65001\\deff0" +
            "{\\fonttbl{\\f0\\fnil\\fcharset134 SimSun;}}" +
            "{\\colortbl ;\\red255\\green0\\blue0;\\red0\\green0\\blue255;}" +
            "\\pard\\fs24" +
            "This is a \\b bold\\b0  and \\i italic\\i0  这是宋体中文文本。\\par" +
            "\\fs20 Normal text with default font.\\par" +
            "}";
          let data = await horse.clipboard.writeRtf(rtfContent);
          console.log(data);
        });
        $("#btnReadImg").addEventListener("click", async () => {
          let data = await horse.clipboard.readImg();
          const uint8Array = new Uint8Array(data.buffer);
          const binary = Array.from(uint8Array)
            .map((byte) => String.fromCharCode(byte))
            .join("");
          const base64String = btoa(binary);
          const base64Image = `data:image/png;base64,${base64String}`;
          data.release();
          console.log(base64Image);
        });
        $("#btnWriteImg").addEventListener("click", async () => {
          let data = await horse.clipboard.writeImg(`D:\\project\\HorseJs\\Doc\\img\\horse.png`);
          console.log(data);
        });
        $("#btnGetFile").addEventListener("click", async () => {
          let data = await horse.clipboard.getFile();
          console.log(JSON.stringify(data));
        });
        $("#btnAddFile").addEventListener("click", async () => {
          let data = await horse.clipboard.addFile("D:\\project\\HorseJs\\Script\\example\\window.html", "D:\\project\\HorseJs\\Script\\example\\tray.html");
          console.log(data);
        });
        $("#btnClearClipboard").addEventListener("click", async () => {
          let data = await horse.clipboard.clear();
          console.log(data);
        });
      });
    </script>
  </body>
</html>
