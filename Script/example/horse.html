<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnGetConfig" class="btn">获取App配置</div>
      <div id="btnNewWindow" class="btn">创建窗口</div>
      <div id="btnGetHorseVer" class="btn">获取HorseJs的版本号</div>
      <div id="btnGetExeVer" class="btn">获取Exe的版本号</div>
      <div id="btnQuit" class="btn">关闭所有窗口，并退出应用</div>
      <div id="btnExit" class="btn">退出应用</div>
      <div id="btnRelaunch" class="btn">启动当前应用的一个新实例</div>
      <div id="btnAppLock" class="btn">禁止双开，并监听双开事件</div>
      <div id="btnNewWinEvent" class="btn">监听新窗口创建事件</div>
      <div id="btnWinCloseEvent" class="btn">监听旧窗口关闭事件</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnGetConfig").addEventListener("click", async () => {
          let config = await horse.getConfig();
          console.log(config);
        });
        $("#btnNewWindow").addEventListener("click", async () => {
          let proxy = await horse.createWindow({
            resizable: true,
            maximizable: false,
            minimizable: false,
            alwaysOnTop: false,
            skipTaskbar: false,
            visible: true,
            frame: false,
            shadow: true,
            title: "窗口标题！！！",
            size: {
              w: 1000,
              h: 800,
            },
            minSize: {
              w: 250,
              h: 200,
            },
            position: {
              x: 200,
              y: 200,
            },
            page: {
              areDefaultScriptDialogsEnabled: true,
              isScriptEnabled: true,
              isWebMessageEnabled: true,
              url: "index.html",
            },
          });
          // let obj = await proxy.addEventListener("sizePosChanged", (data) => {
          // console.log(`x:${data.x},y:${data.y},w:${data.w},h:${data.h}`);
          // });
          await proxy.minimize();
        });
        $("#btnGetHorseVer").addEventListener("click", async () => {
          let data = await horse.getHorseVer();
          console.log(JSON.stringify(data));
        });
        $("#btnGetExeVer").addEventListener("click", async () => {
          let data = await horse.getExeVer();
          console.log(JSON.stringify(data));
        });
        $("#btnQuit").addEventListener("click", async () => {
          let data = await horse.quit();
          console.log(JSON.stringify(data));
        });
        $("#btnExit").addEventListener("click", async () => {
          horse.exit(1);
        });
        $("#btnRelaunch").addEventListener("click", async () => {
          let data = await horse.relaunch();
          console.log(JSON.stringify(data));
        });
        $("#btnAppLock").addEventListener("click", async () => {
          let data = await horse.relaunch();
          console.log(JSON.stringify(data));
        });
        $("#btnNewWinEvent").addEventListener("click", async () => {
          let data = await horse.on("newWin", (obj) => {
            console.log(obj);
          });
          console.log(JSON.stringify(data));
        });
        $("#btnWinCloseEvent").addEventListener("click", async () => {
          let data = await horse.relaunch();
          console.log(JSON.stringify(data));
        });
      });
    </script>
  </body>
</html>
