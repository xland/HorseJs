<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnLoad" class="btn">加载dll</div>
      <div id="btnFree" class="btn">释放dll</div>
      <div id="btnInvoke" class="btn">调用dll中的方法</div>
      <div id="btnRegEvent" class="btn">注册自定义事件</div>
      <div id="btnunRegEvent" class="btn">取消注册自定义事件</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        let dllId = -1;
        $("#btnLoad").addEventListener("click", async () => {
          let data = await horse.dll.load("TestDll.dll");
          console.log(data);
          dllId = data.id;
        });
        $("#btnFree").addEventListener("click", async () => {
          let data = await horse.dll.free(dllId);
          console.log(data);
        });
        $("#btnInvoke").addEventListener("click", async () => {
          let data = await horse.dll.invoke(dllId, "joinStr", "hello,");
          console.log(data);
        });
        $("#btnRegEvent").addEventListener("click", async () => {
          let data = await horse.dll.on(dllId, "customEvent", (data) => {
            console.log("event", data);
          });
          console.log(data);
        });
        $("#btnunRegEvent").addEventListener("click", async () => {
          let data = await horse.dll.off(dllId, "customEvent");
          console.log(data);
        });
      });
    </script>
  </body>
</html>
