<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/example.css" />
  </head>
  <body>
    <div class="box">
      <div id="btnOpen" class="btn">打开数据库（不存在则创建）</div>
      <div id="btnClose" class="btn">关闭数据库</div>
      <div id="btnSql" class="btn">执行SQL语句</div>
      <div id="btnDel" class="btn">删除数据库</div>
    </div>
    <script>
      let $ = (selector) => document.querySelector(selector);
      window.addEventListener("DOMContentLoaded", async () => {
        $("#btnOpen").addEventListener("click", async () => {
          let data = await horse.db.open("db.db", true);

          console.log(JSON.stringify(data));
        });
        $("#btnClose").addEventListener("click", async () => {
          let data = await horse.db.close("db.db");
          console.log(data);
        });
        $("#btnSql").addEventListener("click", async () => {
          let data = await horse.db.exec(
            `CREATE TABLE Job(Id VARCHAR2(36) NOT NULL ON CONFLICT FAIL UNIQUE ON CONFLICT FAIL,JobInfo TEXT,RepeatType INT,StartTime BIGINT,EndTime BIGINT,ColorIndex INT);
CREATE INDEX JobInfo_Index ON Job(JobInfo);
CREATE TABLE Setting(ViewDefault INT DEFAULT 0,ViewVal Int,LangDefault INT DEFAULT 0,SkinDefault INT DEFAULT 0,AlertBefore INT);
INSERT INTO Setting (ViewDefault,ViewVal,LangDefault,SkinDefault,AlertBefore) VALUES (0,0,0,0,5);`,
            "db.db"
          );
          console.log(data);
        });
        $("#btnDel").addEventListener("click", async () => {
          let data = await horse.db.del("db.db", true);
          console.log(data);
        });
      });
    </script>
  </body>
</html>
