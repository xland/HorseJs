<html>
    <head>
        <meta charset="UTF-8">
        <title>HorseJs</title>
        <link rel="stylesheet" href="css/iconfont.css">
        <style>
            html,body{
                margin: 0px;padding: 0px;font-size: 12px;
            }
            .btn{cursor: pointer; background: #eee; display: inline-block; user-select: none;
                border-radius: 3px; margin: 6px; padding: 6px;}
            .btn:hover{background: #888; color: #fff;}
            #titleBar{
                background: #CCD5F0;user-select: none;line-height: 32px;height: 32px;display: flex;
            }
            #titleBox{
                padding-left: 12px;
                flex: 1;
            }
            .titleBtn{
                width: 38px;
                text-align: center;
                cursor: pointer;
            }
            .titleBtn:hover{
                background: #E9EEFF;
            }
            #btnCloseT:hover{
                background: red !important;
                color: #fff !important;
            }
            i{
                font-size: 12px !important;
            }
            .box{
                padding: 12px;
            }

        </style>
    </head>
    <body>
        <div id="titleBar">
            <div id="titleBox">html自定义窗口标题栏</div>
            <div id="btnMinimizeT" class="titleBtn"><i class="iconfont horse-minimize"></i></div>
            <div id="btnMaximizeT" class="titleBtn"><i class="iconfont horse-maximize"></i></div>
            <div id="btnRestoreT" class="titleBtn" style="display:none;"><i class="iconfont horse-restore"></i></div>
            <div id="btnCloseT" class="titleBtn"><i class="iconfont horse-close"></i></div>
        </div>
        <div class="box">
            <p>horse</p>
            <div id="btnGetConfig" class="btn">获取App配置</div>
            <p>window</p>
            <div id="btnMaximize" class="btn">最大化</div>
            <div id="btnMinimize" class="btn">最小化</div>
            <div id="btnShow" class="btn">显示</div>
            <div id="btnHide" class="btn">隐藏</div>
            <div id="btnRestore" class="btn">还原</div>
            <div id="btnResize" class="btn">改变大小</div>
            <div id="btnBindRes" class="btn">附加资源</div>
            <div id="btnClose" class="btn">关闭窗口</div>
            <div id="btnDestory" class="btn">销毁窗口</div>
            <div id="btnFlash" class="btn">闪烁窗口</div>
            <div id="btnSetResizable" class="btn">启用/禁止改变窗口大小</div>
            <div id="btnRegWinClose" class="btn">注册窗口关闭事件</div>
            <div id="btnUnregWinClose" class="btn">取消注册窗口关闭事件</div>
        </div>

    <script>
        let $ = (selector)=>document.querySelector(selector);
        let initTitleBar = ()=>{
            $("#btnMaximizeT").addEventListener("click",async ()=>{
                await horse.window.maximize();
                $("#btnMaximizeT").setAttribute('style', 'display:none;');
                $("#btnRestoreT").setAttribute('style',"");
            })
            $("#btnMinimizeT").addEventListener("click",()=>{
                horse.window.minimize();
            })
            $("#btnCloseT").addEventListener("click", () => {
                horse.window.close();
            });
            $("#btnRestoreT").addEventListener("click",()=>{
                horse.window.restore();
                $("#btnMaximizeT").setAttribute('style', '');
                $("#btnRestoreT").setAttribute('style', 'display:none;');
            })
            horse.window.addEventListener("stateChangedIsReg",async (state)=>{

            })
        }
        window.addEventListener("DOMContentLoaded", async () => {
            initTitleBar();
            $("#titleBox").addEventListener("mousedown",async ()=>{
                horse.window.startDrag();
            })
            $("#btnGetConfig").addEventListener("click",async ()=>{
                let config = await horse.getConfig();
                console.log(config);
            })
            $("#btnMaximize").addEventListener("click",()=>{
                horse.window.maximize();
            })
            $("#btnMinimize").addEventListener("click",()=>{
                horse.window.minimize();
            })
            $("#btnHide").addEventListener("click",()=>{
                horse.window.hide();
                setTimeout(()=>{
                    horse.window.show();
                },2000)
            })
            $("#btnRestore").addEventListener("click",()=>{
                horse.window.restore();
            })
            $("#btnRegWinClose").addEventListener("click",()=>{
                horse.window.addEventListener("closing", async ()=>{
                    alert("现在你只能用销毁窗口关闭此窗口了");
                });
            });
            $("#btnUnregWinClose").addEventListener("click",async ()=>{
                await horse.window.removeEventListener("closing");
                alert("现在你可以正常关闭窗口了");
            });
            $("#btnResize").addEventListener("click",async ()=>{
                await horse.window.resize(1200, 600);
            });
            let isResizalbe = true;
            $("#btnSetResizable").addEventListener("click",async ()=>{
                isResizalbe = !isResizalbe;
                await horse.window.setResizable(isResizalbe);
            });
            $("#btnBindRes").addEventListener("click", async () => {
                horse.fs.addResToExe("D:\\project\\HorseJs\\x64\\Release\\UI\\", "D:\\project\\HorseJs\\x64\\Release\\HorseJs.exe");
            });
            $("#btnClose").addEventListener("click", () => {
                horse.window.close();
            });
            $("#btnDestory").addEventListener("click", () => {
                horse.window.destroy();
            });
            $("#btnFlash").addEventListener("click", () => {
                setTimeout(()=>{
                    horse.window.flash(true);
                    setTimeout(()=>{
                        horse.window.flash(false);
                    },2000);
                },2000);                
            });
            horse.window.show();
        });
        window.addEventListener('resize', ()=>{
            //这是html自带的事件
            console.log('宽度：' + window.innerWidth + '高度：' + window.innerHeight);
        });
        horse.window.addEventListener("sizePosChanged",(x,y,w,h)=>{
            console.log(`x:${x},y:${y},w:${w},h:${h}`);
        })
    </script>
    </body>
</html>
