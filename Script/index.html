<html>
    <head>
        <meta charset="UTF-8">
        <title>HorseJs</title>
    </head>
    <body>
    <div id="btnMaximize">最大化</div>
    <div id="btnMinimize">最小化</div>
    <div id="btnResize">改变大小</div>
    <div id="">最大化</div>
    <div id="">最大化</div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            horse.window.addEventListener("closing", async ()=>{
                console.log("close")
                alert("确定要关闭窗口吗");
                await horse.window.removeEventListener("closing");
            });
            horse.window.addEventListener("sized",(w,h)=>{
                console.log("sized----:",w,h);
            });
            let btnMaximize = document.querySelector("#btnMaximize");
            btnMaximize.addEventListener("click",()=>{
                horse.window.maximize();
            })
            let btnResize = document.querySelector("#btnResize");
            btnResize.addEventListener("click",async ()=>{
                let result = await horse.window.resize(1200, 600);
                console.log(result);
            });
        });
    </script>
    </body>
</html>
